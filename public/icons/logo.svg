<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#08090d" />
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="url(#grad)" stroke-width="6" opacity="0.4" />
  
  <!-- Controller Body -->
  <g filter="url(#neon)">
    <path d="M150 170 C100 170 70 210 70 290 C70 360 110 400 150 400 C180 400 200 360 230 360 L282 360 C312 360 332 400 362 400 C402 400 442 360 442 290 C442 210 412 170 362 170 Z" 
          fill="#131626" stroke="url(#grad)" stroke-width="12" stroke-linejoin="round" />
    
    <!-- D-Pad -->
    <path d="M160 220 L160 250 L130 250 L130 270 L160 270 L160 300 L180 300 L180 270 L210 270 L210 250 L180 250 L180 220 Z" fill="#00f0ff" />
    
    <!-- Action Buttons -->
    <circle cx="340" cy="235" r="14" fill="#ff007f" />
    <circle cx="375" cy="260" r="14" fill="#a855f7" />
    <circle cx="305" cy="260" r="14" fill="#00ff66" />
    <circle cx="340" cy="285" r="14" fill="#ffdd00" />
    
    <!-- Center Screen / Logo text -->
    <circle cx="230" cy="260" r="8" fill="#3b82f6" />
    <circle cx="282" cy="260" r="8" fill="#3b82f6" />
    
    <!-- Lightning / Game Zone Bolt -->
    <polygon points="256,190 242,230 258,230 248,270 270,225 254,225" fill="#00f0ff" />
  </g>
</svg>

